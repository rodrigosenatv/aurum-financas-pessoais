<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a0e"/>
      <stop offset="50%" stop-color="#090d07"/>
      <stop offset="100%" stop-color="#050704"/>
    </linearGradient>
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6f244" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#eccb6b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b6f244" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="logoAurumGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbfb73"/>
      <stop offset="45%" stop-color="#b6f244"/>
      <stop offset="85%" stop-color="#84c519"/>
      <stop offset="100%" stop-color="#e8cd68"/>
    </linearGradient>
    <linearGradient id="logoLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ebc16"/>
      <stop offset="60%" stop-color="#b6f244"/>
      <stop offset="100%" stop-color="#f5e28a"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#b6f244" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem Badge -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#logoBgGrad)"/>
    <rect x="0" y="0" width="80" height="80" rx="22" fill="none" stroke="url(#logoBorderGrad)" stroke-width="2"/>
    
    <!-- Mini Emblem Scales (80x80 inside) -->
    <g transform="translate(40, 40) scale(0.13) translate(-256, -256)" filter="url(#logoShadow)">
      <path d="M256 108 C256 108 368 236 368 324 C368 376 324 404 274 404 C236 404 204 384 192 352 C216 352 248 338 266 316 C288 290 292 254 284 224 L256 108 Z" fill="url(#logoAurumGold)"/>
      <path d="M256 108 C256 108 144 236 144 324 C144 366 172 396 210 402 C196 376 196 342 208 314 C222 282 250 252 256 214 L256 108 Z" fill="url(#logoLeafGrad)" opacity="0.95"/>
      <path d="M256 180 C276 220 312 250 316 290 C320 326 296 354 262 354 C244 354 232 344 226 332 C220 318 222 298 232 278 C242 258 252 232 256 180 Z" fill="#dbfb73"/>
      <polygon points="256,128 266,154 256,180 246,154" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- Typography Text -->
  <g transform="translate(108, 0)">
    <text x="0" y="54" font-family="Space Grotesk, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#eef2e4">
      aurum
      <tspan fill="#b6f244">.</tspan>
    </text>
    <text x="2" y="74" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="3.2" fill="#878d7c" text-transform="uppercase">
      FINANÇAS PESSOAIS
    </text>
  </g>
</svg>
