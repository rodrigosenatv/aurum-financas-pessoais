<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a0e"/>
      <stop offset="50%" stop-color="#090d07"/>
      <stop offset="100%" stop-color="#050704"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6f244" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#eccb6b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b6f244" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="aurumGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbfb73"/>
      <stop offset="45%" stop-color="#b6f244"/>
      <stop offset="85%" stop-color="#84c519"/>
      <stop offset="100%" stop-color="#e8cd68"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ebc16"/>
      <stop offset="60%" stop-color="#b6f244"/>
      <stop offset="100%" stop-color="#f5e28a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6f244" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b6f244" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#b6f244" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#glowGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Glowing Accent Disc -->
  <circle cx="256" cy="256" r="160" fill="#b6f244" opacity="0.04" filter="blur(20px)"/>

  <!-- Official Aurum Emblem: Monogram 'A' + Financial Growth Sprout -->
  <g filter="url(#shadow)">
    <!-- Right Arch / Stem -->
    <path d="M256 108 C256 108 368 236 368 324 C368 376 324 404 274 404 C236 404 204 384 192 352 C216 352 248 338 266 316 C288 290 292 254 284 224 L256 108 Z" fill="url(#aurumGold)"/>

    <!-- Left Leaf / Apex Curve -->
    <path d="M256 108 C256 108 144 236 144 324 C144 366 172 396 210 402 C196 376 196 342 208 314 C222 282 250 252 256 214 L256 108 Z" fill="url(#leafGrad)" opacity="0.95"/>

    <!-- Dynamic Sprout Core Leaf -->
    <path d="M256 180 C276 220 312 250 316 290 C320 326 296 354 262 354 C244 354 232 344 226 332 C220 318 222 298 232 278 C242 258 252 232 256 180 Z" fill="#dbfb73"/>

    <!-- Center Light Spark / Diamond of Wealth -->
    <polygon points="256,128 266,154 256,180 246,154" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
